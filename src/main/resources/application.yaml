spring:
  application:
    name: bbangmoa-server

  datasource:
    # ${환경변수:기본값} — 컨테이너에서는 compose가 넣어준 값을,
    # IDE에서 그냥 실행할 때는 뒤의 기본값을 쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bbangmoa}
    username: ${DB_USERNAME:bbangmoa}
    password: ${DB_PASSWORD:localdev}
    hikari:
      # DB로 가는 연결을 미리 만들어두고 돌려쓴다. 요청마다 새로 만들면 DB가 죽는다.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2

  jpa:
    hibernate:
      # 엔티티와 실제 테이블이 다르면 부팅을 실패시킨다.
      # update로 두면 엔티티가 테이블을 멋대로 바꿔서 스키마의 진실이 두 곳이 된다.
      ddl-auto: validate
    # 커넥션을 화면 렌더링까지 붙들지 않고 쿼리 직후 반납한다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # 스키마 변경의 단일 진실. db/migration의 V1, V2... 를 순서대로 적용하고
    # 어디까지 적용했는지 DB가 스스로 기억한다.
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. 기본으로 다 열면 내부 정보가 새어나간다.
        include: health,info
      # Actuator 엔드포인트는 WebConfig의 CorsRegistry를 타지 않는다 —
      # 별도의 핸들러 매핑(WebMvcEndpointHandlerMapping)이라 여기 따로 설정해야 한다.
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
        allowed-methods: GET,POST
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

server:
  # 앞에 Nginx가 서면 클라이언트 IP·프로토콜이 프록시 헤더로 온다.
  # 이걸 켜야 스프링이 원래 요청을 https로 인식한다.
  forward-headers-strategy: framework

app:
  cors:
    # WebConfig가 이 값을 읽어 일반 API(/api/** 등)의 CORS를 연다.
    # 위 management.endpoints.web.cors.allowed-origins 와 같은 환경변수를 재사용한다 —
    # 하나만 export되고 다른 하나는 빠져 CORS 설정이 두 갈래로 어긋나는 걸 막기 위해서다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  tour:
    # 상류 주소. 뒤에 /areaBasedList2 같은 오퍼레이션 이름이 붙는다.
    base-url: https://apis.data.go.kr/B551011/KorService2
    # 키가 없으면 빈 문자열 → 컨트롤러가 503 을 낸다. 부팅은 된다.
    service-key: ${TOUR_API_KEY:}
    # 여기 없는 이름은 상류를 부르지도 않고 404.
    # 프론트가 실제로 쓰는 셋만 연다(tourApi.js 기준).
    allowed-operations: areaBasedList2,detailCommon2,detailIntro2
    connect-timeout: 3s
    read-timeout: 5s
    # 2MiB. 관광공사 응답은 보통 수십 KB 라 넉넉하다.
    max-response-bytes: 2097152

  ratelimit:
    enabled: true
    # 프론트가 한 화면을 그릴 때 관광공사를 여러 번 부른다(빵집 + 관광지 4종 + 상세).
    # 사람이 정상적으로 쓰면 분당 수십 회. 60 이면 정상 사용은 안 막고
    # 스크립트로 긁는 건 걸린다.
    requests-per-minute: 60

logging:
  level:
    root: INFO
