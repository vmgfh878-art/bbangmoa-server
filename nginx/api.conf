# api.breadmoa.com 리버스 프록시.
#
# 이 파일은 certbot이 인증서를 넣기 전 "임시 버전"이다.
# certbot --nginx 가 이 파일을 읽고 알아서 443/ssl 블록을 추가해준다.
# 그래서 처음엔 80번(HTTP)만 있고 리다이렉트도 없다 — 인증서가 아직 없으니까.

server {
    listen 80;
    listen [::]:80;
    server_name api.breadmoa.com;

    # Let's Encrypt가 도메인 소유를 확인할 때 이 경로로 접속해본다.
    # certbot이 여기 파일을 놓고, 우리 서버가 응답하면 "주인 맞다"고 인증서를 내준다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        # 이게 없으면 스프링은 모든 요청이 Nginx(127.0.0.1)에서 온 것으로 착각한다.
        # 진짜 요청자 IP와 https였다는 사실을 이 헤더들로 넘겨준다.
        # application.yaml의 forward-headers-strategy: framework 가 이걸 읽는다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # $proxy_add_x_forwarded_for 가 아니라 $remote_addr 인 이유
        #   앞의 것은 "클라이언트가 보낸 X-Forwarded-For + 진짜 IP" 로 덧붙인다.
        #   스프링은 그 목록의 맨 앞을 클라이언트 IP 로 보므로, 클라이언트가
        #   X-Forwarded-For 를 직접 적어 보내면 그 값이 채택된다.
        #   운영에서 재현했다: 헤더 값만 바꿔가며 보내면 IP 당 레이트 리밋이 매번 초기화됐다.
        #   Nginx 가 이 서비스의 맨 앞이므로 $remote_addr 이 곧 진짜 클라이언트다. 덮어쓴다.
        #
        #   ⚠ Cloudflare 주황 구름(Proxied)을 켜면 $remote_addr 이 Cloudflare 주소가 된다.
        #     그때는 real_ip 모듈로 CF-Connecting-IP 를 풀어준 뒤 이 줄을 다시 봐야 한다.
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
