# 로컬 개발용 구성.
# 환경변수를 하나도 안 만들어도 그대로 뜬다 — ${VAR:-기본값} 문법 덕분.
# 운영에서는 진짜 값을 환경변수로 덮어쓴다.

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: bbangmoa-db
    environment:
      POSTGRES_DB: ${DB_NAME:-bbangmoa}
      POSTGRES_USER: ${DB_USERNAME:-bbangmoa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
      TZ: Asia/Seoul
    ports:
      # 앞의 127.0.0.1이 핵심. 이걸 빼면 0.0.0.0이 기본값이 되어
      # 이 컴퓨터가 붙은 네트워크 전체에 DB가 열린다.
      - "127.0.0.1:5432:5432"
    volumes:
      # 컨테이너를 지워도 데이터가 남는 이유. 왼쪽이 진짜 폴더, 오른쪽이 컨테이너 안 경로.
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      # "떴다"와 "접속을 받을 준비가 됐다"는 다르다. 이걸 api가 기다린다.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bbangmoa} -d ${DB_NAME:-bbangmoa}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [bbangmoa-net]

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bbangmoa-redis
    # ports 없음 = 호스트에 안 열린다. 도커 네트워크 안에서만 보인다.
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [bbangmoa-net]

  # ── Spring Boot ─────────────────────────────────────────────
  api:
    # image 와 build 를 같이 둔다.
    #   로컬: docker compose up -d --build  → 여기서 굽고 이 이름을 붙인다
    #   서버: docker compose pull           → GHCR 에서 이 이름을 받아온다
    # TAG 가 없으면 latest. 배포 워크플로가 .env 에 TAG=sha-xxxxxxx 를 적어준다.
    image: ghcr.io/vmgfh878-art/bbangmoa-server:${TAG:-latest}
    build: .
    container_name: bbangmoa-api
    ports:
      # 로컬에서도 루프백만. 서버에서는 Nginx가 앞에 서므로 이대로 둔다.
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      # 주소가 localhost가 아니라 db·redis인 이유:
      # 컨테이너 안의 localhost는 "그 컨테이너 자신"이다.
      # 같은 네트워크에서는 서비스 이름이 곧 호스트명이 된다.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-bbangmoa}
      DB_USERNAME: ${DB_USERNAME:-bbangmoa}
      DB_PASSWORD: ${DB_PASSWORD:-localdev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TZ: Asia/Seoul
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m -XX:+UseG1GC}
    depends_on:
      # condition을 안 쓰면 "켜는 순서"만 보장되고 준비 완료는 보장 안 된다.
      # DB가 아직 초기화 중일 때 api가 붙으려다 죽는 게 그 때문이다.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      # 안 걸면 로그가 무한히 쌓여 디스크를 채운다. 장애 원인 1위.
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks: [bbangmoa-net]

networks:
  bbangmoa-net:
    driver: bridge
